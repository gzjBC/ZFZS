name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Prepare canonical desktop environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\run_desktop.ps1 -PrepareOnly
      - name: Parse PowerShell scripts and test without installing (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          .\scripts\test.ps1 -NoInstall
          .\start.bat -PrepareOnly -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'Batch launcher verification failed.' }
      - name: Prepare and test canonical desktop environment (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n scripts/run_desktop.sh scripts/build_desktop.sh
          bash scripts/run_desktop.sh --prepare-only
          python_path="$(bash scripts/run_desktop.sh --print-python --no-install)"
          DATABASE_URL='sqlite:///:memory:' "$python_path" -B -m unittest discover -s tests -v
      - name: Check Python syntax without importing the app or writing bytecode
        run: python -B -c "import ast, pathlib; files = [*pathlib.Path('scripts').glob('*.py'), *pathlib.Path('backend').rglob('*.py')]; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]; print(f'Parsed {len(files)} Python files')"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime -d anime_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://anime:anime@localhost:5432/anime_tracker
      TEST_DATABASE_URL: postgres://anime:anime@localhost:5432/anime_tracker_test
      BANGUMI_USER_AGENT: ZFZS-CI/0.2 (https://github.com/gzjBC/ZFZS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:init
      - run: npm run check
      - run: npm run build
