name: Build native desktop apps

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: .\scripts\build_desktop.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/build_desktop.sh
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/ZFZS Anime Tracker.app" "dist/ZFZS-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ZFZS-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/dist/ZFZS-Anime-Tracker/
            desktop/dist/ZFZS-macOS.zip
          if-no-files-found: error
